# Configuration of generators (defaults illustrated)
---
# The directory where the generated files are stored
# directory: "tmp"

# By default all generators are run. Specify here the ones to skip.
excludes:
  - markdown
  # Every kind of entry may hold every relation, and gen-sqlddl writes one join
  # table per multivalued slot per class: about 4,600 tables, four minutes of a
  # five-minute run, for a graph nobody queries through those tables. The JSON-LD
  # context and the catalogue are the way to a graph database.
  - sqltable

# Alternatively only specify the generators to run
# (comment out the above "excludes" section)
# includes:
#   - markdown
#   - excel

# Set the arguments for the generators (no matter if they run or not)
generator_args:
  excel:
    mergeimports: true
  owl:
    mergeimports: true
    metaclasses: false
    type_objects: false
    add_root_classes: true
    mixins_as_expressions: true
  markdown:
    mergeimports: true
    directory: "docs/elements"
  graphql:
    mergeimports: true
  # gen-java is not yet supported by gen-project.
  #   https://github.com/linkml/linkml/issues/2537
  # java:
  #   mergeimports: true
  #   metadata: true
  jsonld:
    mergeimports: true
  jsonschema:
    mergeimports: true
    # A catalogue's entries range over D3fendEntry, an abstract class. With its
    # concrete descendants the schema offers every kind an entry may be;
    # without them it offers D3fendEntry alone, which no entry passes.
    top_class: D3fendCatalog
    include_range_class_descendants: true
  jsonldcontext:
    mergeimports: true
  # gen-pydantic is not yet supported by gen-project.
  #   https://github.com/linkml/linkml/issues/2537
  # pydantic:
  #   mergeimports: true
  python:
    mergeimports: true
    # head: true  # Why does this not work?
  prefixmap:
    mergeimports: true
  proto:
    mergeimports: true
  shacl:
    mergeimports: true
  shex:
    mergeimports: true
  sqlddl:
    mergeimports: true
  typescript:
    mergeimports: true
    metadata: true

...
