---
id: https://w3id.org/lmodel/d3fend
name: d3fend
title: MITRE D3FEND Knowledge Graph
description: >-
  A LinkML model of MITRE D3FEND, the knowledge graph of cybersecurity countermeasures. It
  models the graph as a catalogue of records: each kind of entry is a class, each property of
  the ontology is a slot under its own IRI, and every term of D3FEND 1.6.0 is a record that
  validates against them.
version: "1.6.0"
source: https://d3fend.mitre.org/ontologies/d3fend/1.6.0/d3fend.ttl
license: Apache-2.0
keywords:
  - countermeasure
  - D3FEND
  - cybersecurity
  - knowledge graph
  - defensive technique
  - digital artifact
see_also:
  - https://lmodel.github.io/d3fend
  - https://d3fend.mitre.org/
annotations:
  upstream_tag: "1.6.0"
  upstream_commit: 91629abb966e
  upstream_release_date: "2026-08-31"
  upstream_copyright: Copyright 2022 The MITRE Corporation
  upstream_terms: https://d3fend.mitre.org/tou
comments:
  - >-
    The version is the edition of D3FEND the schema renders. upstream/ holds its Turtle file
    unchanged, scripts/d3fend_to_linkml.py writes the catalogue and the slots from it, and
    scripts/check_upstream_release.py reports when it moves.
prefixes:
  IAO: http://purl.obolibrary.org/obo/IAO_
  attack: https://w3id.org/lmodel/attack/
  capec: https://w3id.org/lmodel/capec/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  d3fend: https://w3id.org/lmodel/d3fend/
  dcterms: http://purl.org/dc/terms/
  linkml: https://w3id.org/linkml/
  nist_sp_800_53: https://w3id.org/lmodel/nist-sp-800-53/
  owl: http://www.w3.org/2002/07/owl#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  skos: http://www.w3.org/2004/02/skos/core#
  stix: https://w3id.org/lmodel/stix/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: d3fend
default_range: string

imports:
  - linkml:types
  - ./d3fend_core
  - ./d3fend_entries

classes:

  D3fendCatalog:
    title: Catalog
    tree_root: true
    description: One edition of the D3FEND ontology, with its header and all its entries.
    slots:
      - comment
      - release_date
    attributes:
      ontology_iri:
        title: Ontology IRI
        description: The IRI of the ontology.
        identifier: true
        range: uriorcurie
      version_info:
        title: Version
        description: The edition of the ontology.
        slot_uri: owl:versionInfo
        required: true
      version_iri:
        title: Version IRI
        description: The IRI of this edition of the ontology.
        slot_uri: owl:versionIRI
        range: uri
      ontology_title:
        title: Ontology Title
        description: The title of the ontology.
        slot_uri: dcterms:title
      ontology_description:
        title: Ontology Description
        description: The description of the ontology.
        slot_uri: dcterms:description
      ontology_license:
        title: Ontology License
        description: The licence the ontology states.
        slot_uri: dcterms:license
      disjoint_groups:
        title: Disjoint Groups
        description: The sets of classes the ontology declares mutually disjoint.
        multivalued: true
        range: D3fendDisjointGroup
        inlined_as_list: true
      entries:
        title: Entries
        description: Every class and individual of the ontology, as one record each.
        required: true
        multivalued: true
        range: D3fendEntry
        inlined_as_list: true
