# Record d3f:T1003 of D3FEND 1.6.0.
id: d3f:T1003
type: D3fendOffensiveTechnique
owl_kind: class
subclass_of:
  - d3f:CredentialAccessTechnique
attack_id: T1003
definition:
  - 'Adversaries may attempt to dump credentials to obtain account login and credential material, normally
    in the form of a hash or a clear text password. Credentials can be obtained from OS caches, memory,
    or structures.(Citation: Brining MimiKatz to Unix) Credentials can then be used to perform [Lateral
    Movement](https://attack.mitre.org/tactics/TA0008) and access restricted information.'
label:
  - OS Credential Dumping
