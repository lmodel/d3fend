[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
# Named like lmodel/slsa's slsa-linkml, so the PyPI name says what it holds;
# the import package stays d3fend. PyPI publishing is off.
name = "d3fend-linkml"
description = "MITRE D3FEND Knowledge Graph 1.6.0 (LinkML)"
authors = [
  {name = "Noel McLoughlin", email = "noel.mcloughlin@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/d3fend"]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/d3fend/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/d3fend/datamodel/d3fend_pydantic.py",
  "src/d3fend/datamodel/d3fend.py",
  # MITRE's words, copied as published: the upstream's files, the catalogue, the slots
  # and the example records cut from the catalogue. The neighbours' adapt copies, copied
  # as released. Files copied in by the KTL sidecar sync or written by npm, not by hand.
  "upstream/*",
  "src/d3fend/data/*",
  "src/d3fend/schema/d3fend_entries.yaml",
  "tests/data/*",
  "tests/neighbours/*",
  ".lokf/schema/d3fend.yaml",
  ".lokf/scripts/*",
  "website/package-lock.json",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/d3fend/datamodel/d3fend_pydantic.py",
  "src/d3fend/datamodel/d3fend.py",
  "upstream/*",
  "src/d3fend/data/*",
  "src/d3fend/schema/d3fend_entries.yaml",
  "tests/data/*",
  "tests/neighbours/*",
  ".lokf/schema/d3fend.yaml",
  ".lokf/scripts/*",
  "website/package-lock.json",
]
