---
# https://pre-commit.com/
# No hook may rewrite a file this repository does not write by hand: what
# the LinkML generators and `lokf adapt` write, which the next run would
# rewrite back; the upstream's files, which tests hold to their
# hashes; the catalogue and the slots the converter writes; the neighbours' released copies, which tests
# hold to their checksums; npm's lockfile for the release tools; and the KTL
# sidecar's scripts, which the weekly sync replaces.
exclude: >-
  (?x)^(
    src/d3fend/datamodel/|
    src/d3fend/data/|
    src/d3fend/schema/d3fend_entries\.yaml$|
    project/|
    docs/schema/|
    \.lokf/(scripts|m365)/|
    \.lokf/(lokf|d3fend)\.yaml$|
    \.github/release/package-lock\.json$|
    tests/neighbours/|
    upstream/
  )
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^\.copier-answers\.yml$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]
        exclude: ^\.copier-answers\.yml$
        verbose: true  # Show warnings.

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/crate-ci/typos
    rev: v1.46.3
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.14
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.16
    hooks:
      - id: uv-lock
