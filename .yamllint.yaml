# Configuration for https://github.com/adrienverge/yamllint

extends: default

# Specify files to ignore.
ignore:
  # Ignore autogenerated file that does not conform to yamllint rules.
  - .copier-answers.yml
  # Ignore schema files that may not conform due to imports.
  - docs/schema/*.yaml
  # LOKF's schema and the adapt copies, which `lokf adapt` writes with its own
  # list indentation; just lokf-adapt-check holds them to the source.
  - .lokf/lokf.yaml
  - .lokf/d3fend.yaml
  # What scripts/d3fend_to_linkml.py writes; tests hold both to the Turtle.
  - src/d3fend/data/*.yaml
  - src/d3fend/schema/d3fend_entries.yaml
  - tests/neighbours/*.yaml

rules:
  document-start: disable  # Don't check if document has a start marker (---).
  line-length:
    max: 88
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  new-lines: disable  # Don't check for type of new line characters.
