name: d3fend
annotations:
  upstream_tag:
    tag: upstream_tag
    value: 1.6.0
  upstream_commit:
    tag: upstream_commit
    value: 91629abb966e
  upstream_release_date:
    tag: upstream_release_date
    value: '2026-08-31'
  upstream_copyright:
    tag: upstream_copyright
    value: Copyright 2022 The MITRE Corporation
  upstream_license:
    tag: upstream_license
    value: The MITRE Corporation (MITRE) hereby grants you a non-exclusive, royalty-free
      license to use D3FEND for research, development, and commercial purposes. Any
      copy you make for such purposes is authorized provided that you reproduce MITRE's
      copyright designation and this license in any such copy.
  upstream_terms:
    tag: upstream_terms
    value: https://d3fend.mitre.org/tou
description: 'A LinkML model of MITRE D3FEND, the knowledge graph of cybersecurity
  countermeasures. It models the graph as a catalogue of records: each kind of entry
  is a class, each property of the ontology is a slot under its own IRI, and every
  term of D3FEND 1.6.0 is a record that validates against them.'
title: MITRE D3FEND Knowledge Graph
comments:
- The version is the edition of D3FEND the schema renders. upstream/ holds its Turtle
  file unchanged, scripts/d3fend_to_linkml.py writes the catalogue and the slots from
  it, and scripts/check_upstream_release.py reports when it moves.
source: https://d3fend.mitre.org/ontologies/d3fend/1.6.0/d3fend.ttl
see_also:
- https://lmodel.github.io/d3fend
- https://d3fend.mitre.org/
keywords:
- countermeasure
- D3FEND
- cybersecurity
- knowledge graph
- defensive technique
- digital artifact
id: https://w3id.org/lmodel/d3fend
version: 1.6.0
imports:
- linkml:types
- ./d3fend_core
- ./d3fend_entries
license: Apache-2.0
prefixes:
  IAO:
    prefix_prefix: IAO
    prefix_reference: http://purl.obolibrary.org/obo/IAO_
  attack:
    prefix_prefix: attack
    prefix_reference: https://w3id.org/lmodel/attack/
  capec:
    prefix_prefix: capec
    prefix_reference: https://w3id.org/lmodel/capec/
  cwe:
    prefix_prefix: cwe
    prefix_reference: https://w3id.org/lmodel/cwe/
  d3f:
    prefix_prefix: d3f
    prefix_reference: http://d3fend.mitre.org/ontologies/d3fend.owl#
  d3fend:
    prefix_prefix: d3fend
    prefix_reference: https://w3id.org/lmodel/d3fend/
  dcterms:
    prefix_prefix: dcterms
    prefix_reference: http://purl.org/dc/terms/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  nist_sp_800_53:
    prefix_prefix: nist_sp_800_53
    prefix_reference: https://w3id.org/lmodel/nist-sp-800-53/
  owl:
    prefix_prefix: owl
    prefix_reference: http://www.w3.org/2002/07/owl#
  rdf:
    prefix_prefix: rdf
    prefix_reference: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  stix:
    prefix_prefix: stix
