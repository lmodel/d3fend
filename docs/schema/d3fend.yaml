  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: d3fend
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  d3fend_date_time:
    name: d3fend_date_time
    definition_uri: https://w3id.org/lmodel/d3fend/D3fendDateTime
    description: A date and time as the ontology writes it, which may carry no time
      zone.
    title: Date Time
    comments:
    - LinkML's datetime type asks a JSON Schema format checker for a time zone, which
      most of D3FEND's values do not have.
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_core
    typeof: string
    base: str
    uri: xsd:dateTime
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})?$
  d3fend_uri:
    name: d3fend_uri
    definition_uri: https://w3id.org/lmodel/d3fend/D3fendUri
    description: An address as the ontology writes it, typed xsd:anyURI.
    title: Address
    comments:
    - LinkML's uri type asks a JSON Schema format checker for a valid address, and
      three of D3FEND's has-link values are empty strings.
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_core
    typeof: string
    base: str
    uri: xsd:anyURI
enums:
  D3fendOwlKind:
    name: D3fendOwlKind
    definition_uri: https://w3id.org/lmodel/d3fend/D3fendOwlKind
    description: How the ontology declares a term.
    title: OWL Kind
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_core
    permissible_values:
      class:
        text: class
        description: The term is an owl:Class only.
        meaning: owl:Class
        title: Class
      individual:
        text: individual
        description: The term is an owl:NamedIndividual only.
        meaning: owl:NamedIndividual
        title: Individual
      class_and_individual:
        text: class_and_individual
        description: The term is punned, both an owl:Class and an owl:NamedIndividual.
        title: Class and Individual
slots:
  id:
    name: id
    definition_uri: https://w3id.org/lmodel/d3fend/id
    description: The term's IRI, as a CURIE under d3f:.
    title: ID
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    slot_uri: d3fend:id
    identifier: true
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    range: uriorcurie
    required: true
    pattern: ^d3f:\S+$
  type:
    name: type
    definition_uri: https://w3id.org/lmodel/d3fend/type
    description: The kind of entry, as the name of its class in this schema.
    title: Type
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    slot_uri: d3fend:type
    designates_type: true
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    range: string
    required: true
  owl_kind:
    name: owl_kind
    definition_uri: https://w3id.org/lmodel/d3fend/owl_kind
    description: Whether the ontology declares the term a class, an individual or
      both.
    title: OWL Kind
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    slot_uri: d3fend:owl_kind
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    range: D3fendOwlKind
  rdf_type:
    name: rdf_type
    definition_uri: https://w3id.org/lmodel/d3fend/rdf_type
    description: The D3FEND classes the ontology states the term is an instance of.
    title: RDF Type
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    mappings:
    - rdf:type
    slot_uri: rdf:type
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    range: D3fendEntry
    multivalued: true
    inlined: false
  subclass_of:
    name: subclass_of
    definition_uri: https://w3id.org/lmodel/d3fend/subclass_of
    description: The D3FEND classes directly above the term.
    title: Subclass Of
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    mappings:
    - rdfs:subClassOf
    slot_uri: rdfs:subClassOf
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    range: D3fendEntry
    multivalued: true
    inlined: false
  abuses:
    name: abuses
    definition_uri: https://w3id.org/lmodel/d3fend/abuses
    annotations:
      owl_property:
        tag: owl_property
        value: object
      is_defined_by:
        tag: is_defined_by
        value: http://wordnet-rdf.princeton.edu/id/01163606-v
    description: 'x abuses y: The entity x applies an artifact y to a wrong thing
      or person; x applies y badly or incorrectly.'
    title: abuses
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    aliases:
    - misapplies
    - misuses
    mappings:
    - d3f:abuses
    is_a: uses
    domain: D3fendEntry
    slot_uri: d3f:abuses
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    range: D3fendEntry
    multivalued: true
    inlined: false
  access_mediated_by:
    name: access_mediated_by
    definition_uri: https://w3id.org/lmodel/d3fend/access_mediated_by
    annotations:
      owl_property:
        tag: owl_property
        value: object
    description: 'x access-mediated-by y: The entity or resource x has its access
      regulated, controlled, or facilitated by entity y, which acts as an intermediary
      or gatekeeper to enforce access control policies.'
    title: access-mediated-by
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    mappings:
    - d3f:access-mediated-by
    is_a: associated_with
    domain: D3fendEntry
    slot_uri: d3f:access-mediated-by
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    inverse: mediates_access_to
    range: D3fendEntry
    multivalued: true
    inlined: false
  accessed_by:
    name: accessed_by
    definition_uri: https://w3id.org/lmodel/d3fend/accessed_by
    annotations:
      owl_property:
        tag: owl_property
        value: object
    description: 'x accessed-by y: The entity or resource x is accessed by entity
      y.'
    title: accessed-by
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    mappings:
    - d3f:accessed-by
    is_a: associated_with
    mixins:
    - may_be_accessed_by
    domain: D3fendEntry
    slot_uri: d3f:accessed-by
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    inverse: accesses
    range: D3fendEntry
    multivalued: true
    inlined: false
  accesses:
    name: accesses
    definition_uri: https://w3id.org/lmodel/d3fend/accesses
    annotations:
      owl_property:
        tag: owl_property
        value: object
      is_defined_by:
        tag: is_defined_by
        value: http://wordnet-rdf.princeton.edu/id/02673854-n
    description: 'x accesses y: The subject x takes the action of reading from, writing
      into, or executing the stored information in the object y. Reads, writes, and
      executes are specific cases of accesses.'
    title: accesses
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    mappings:
    - d3f:accesses
    is_a: associated_with
    mixins:
    - may_access
    domain: D3fendEntry
    slot_uri: d3f:accesses
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    inverse: accessed_by
    range: D3fendEntry
    multivalued: true
    inlined: false
  addressed_by:
    name: addressed_by
    definition_uri: https://w3id.org/lmodel/d3fend/addressed_by
    annotations:
      owl_property:
        tag: owl_property
        value: object
    description: 'x addressed-by y: Relates a resource x (e.g., network host, peripheral
      device, disk sector, a memory cell or other logical or physical entity) to a
      discrete address y in an address space that points to it.'
    title: addressed-by
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    mappings:
    - d3f:addressed-by
    is_a: associated_with
    domain: D3fendEntry
    slot_uri: d3f:addressed-by
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    inverse: addresses
    range: D3fendEntry
    multivalued: true
    inlined: false
  addresses:
    name: addresses
    definition_uri: https://w3id.org/lmodel/d3fend/addresses
    annotations:
      owl_property:
        tag: owl_property
        value: object
    description: 'x addresses y: Relates a pointer x to a digital artifact y located
      in the address space to which x points. The address space is part of some digital
      store, whether it be in memory, an image, or a persistent storage device.'
    title: addresses
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    see_also:
    - http://dbpedia.org/resource/Pointer_(computer_programming)
    - http://wordnet-rdf.princeton.edu/id/02253826-v
    aliases:
    - points-to
    mappings:
    - d3f:addresses
    is_a: associated_with
    domain: D3fendEntry
    slot_uri: d3f:addresses
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    inverse: addressed_by
    range: D3fendEntry
    multivalued: true
    inlined: false
  adds:
    name: adds
    definition_uri: https://w3id.org/lmodel/d3fend/adds
    annotations:
      owl_property:
        tag: owl_property
        value: object
    description: 'x adds y: The subject x adds a data object y, such as a file, to
      some other digital artifact, such as a directory. Examples include an agent
      or technique adding a record to a database or a domain entry to a DNS server.'
    title: adds
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    mappings:
    - d3f:adds
    is_a: associated_with
    mixins:
    - may_add
    slot_uri: d3f:adds
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    range: D3fendEntry
    multivalued: true
    inlined: false
  alt_label:
    name: alt_label
    definition_uri: https://w3id.org/lmodel/d3fend/alt_label
    annotations:
      owl_property:
        tag: owl_property
        value: annotation
    description: D3FEND's property "altLabel", which the ontology does not define.
    title: altLabel
    from_schema: https://w3id.org/lmodel/d3fend/d3fend_entries
    mappings:
    - skos:altLabel
    slot_uri: skos:altLabel
    owner: D3fendEntry
    domain_of:
    - D3fendEntry
    range: string
    multivalued: true
  analyzes:
    name: analyzes
    definition_uri: https://w3id.org/lmodel/d3fend/analyzes
    annotations:
      owl_property:
